name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queued runs are skipped, but an in-flight *production* deployment is allowed
# to finish — cancelling one mid-flight can leave Pages on a half-published
# state. Same setting as GitHub's own Pages starter workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `enablement: true` only works when the token may CREATE the Pages site,
      # which needs repo admin — GITHUB_TOKEN and GitHub App installation tokens
      # do not have it. On this repo it failed with
      #   Create Pages site failed. Error: Resource not accessible by integration
      # so the Pages source must be set by hand, once, by a repo admin:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # Still pending as of 2026-09-13 — until it is set this step fails here
      # and nothing is published. It is kept `true` because it is a no-op once
      # the site exists (and lets a fork with an admin token bootstrap itself).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        # Pages serves the app under /piano-trainer/ — every link and asset
        # goes through `base` from $app/paths.
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
